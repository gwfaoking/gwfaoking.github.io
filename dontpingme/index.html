<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>저 찾지마세요! · don't ping me!</title>
<style>
:root{--bg:#f7f8fa;--fg:#1c2430;--muted:#5b6675;--card:#fff;--line:#dfe3e8;--accent:#345779}
@media (prefers-color-scheme:dark){:root{--bg:#11161d;--fg:#e4e8ee;--muted:#9aa5b3;--card:#1a212b;--line:#2c3542;--accent:#8fb3d9}}
*{box-sizing:border-box}
body{margin:0;word-break:keep-all;overflow-wrap:anywhere;background:var(--bg);color:var(--fg);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",Roboto,sans-serif}
main{max-width:820px;margin:0 auto;padding:24px 16px 64px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 20px}
nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;color:var(--muted);font-size:14px}
a{color:var(--accent)}
h1{font-size:1.6rem;line-height:1.3;margin:0 0 8px}
h2{font-size:1.15rem;margin:32px 0 8px;padding-top:8px;border-top:1px solid var(--line)}
h3{font-size:1rem;margin:20px 0 6px}
.table{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}
th,td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{background:color-mix(in srgb,var(--accent) 10%,transparent)}
blockquote{margin:12px 0;padding:8px 14px;border-left:3px solid var(--line);color:var(--muted)}
code{font-size:.9em}
</style>
</head>
<body>
<main>
<article class="card">
<h1>저 찾지마세요! · don't ping me!</h1>
<p>급한 거 아니면, 나중에 볼게요.<br>not urgent? i’ll check later.</p>

</article>
</main>
</body>
</html>
